kind = "web"
previewPath = "/"
title = "ILovePDF - Browser PDF Tools"
version = "1.0.0"
id = "artifacts/ilovepdf"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23968

[services.development]
run = "pnpm --filter @workspace/ilovepdf run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ilovepdf", "run", "build" ]
publicDir = "artifacts/ilovepdf/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23968"
BASE_PATH = "/"
