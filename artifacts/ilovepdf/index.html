<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILovePDF - Free Online PDF Tools</title>
  <meta name="description" content="Free online PDF tools. Merge, split, compress, convert PDFs — all processed in your browser. No uploads, no servers, 100% private." />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" />
  <meta name="theme-color" content="#7B3FF2" />
  <meta property="og:title" content="ILovePDF - Free Online PDF Tools" />
  <meta property="og:description" content="Merge, split, compress, convert PDFs — 100% free, 100% in your browser." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { primary: { DEFAULT: '#7B3FF2', dark: '#6025D9', light: '#9B6BF5' } }
        }
      }
    }
  </script>
  <style>
    :root { --primary:#7B3FF2; --primary-dark:#6025D9; --primary-light:#9B6BF5; --bg:#fff; --text:#1A1530; --text-muted:#6B7280; --border:#E5E7EB; --header-h:64px; }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text)}
    .container{max-width:1280px;margin:0 auto;padding:0 1.5rem}
    header{height:var(--header-h);position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    @media(max-width:768px){:root{--header-h:56px}}
    .btn-primary{background:linear-gradient(135deg,#7B3FF2,#9B6BF5);color:white;border:none;border-radius:10px;height:56px;padding:0 2rem;font-weight:600;font-size:1rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.5rem;min-width:44px;min-height:44px;font-family:'Plus Jakarta Sans',sans-serif}
    .btn-primary:hover{background:linear-gradient(135deg,#6025D9,#7B3FF2);transform:translateY(-1px);box-shadow:0 8px 25px rgba(123,63,242,.35)}
    .btn-primary:active{transform:translateY(0)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
    .upload-zone{border:2px dashed #D1D5DB;border-radius:16px;padding:3rem 2rem;text-align:center;cursor:pointer;transition:all .2s;background:#FAFAFA}
    .upload-zone:hover,.upload-zone.drag-over{border-color:var(--primary);background:#F3EEFF}
    .trust-bar{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:.75rem 1.25rem;font-size:.875rem;color:#166534;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .result-box{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;padding:1.5rem;margin-top:1.5rem;display:none}
    .result-box.show{display:block}
    .error-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:1.25rem;margin-top:1rem;color:#991B1B;display:none}
    .error-box.show{display:block}
    .tool-card{background:white;border:1px solid var(--border);border-radius:14px;padding:1.5rem;cursor:pointer;transition:all .2s;text-decoration:none;color:var(--text);display:block}
    .tool-card:hover{border-color:var(--primary);box-shadow:0 8px 25px rgba(123,63,242,.12);transform:translateY(-2px)}
    #loading-screen{position:fixed;inset:0;background:white;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:1rem;transition:opacity .3s}
    .loading-ring{width:48px;height:48px;border:4px solid #EDE9FE;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
    footer{background:#1A1530;color:#D1D5DB;padding:4rem 0 2rem;margin-top:5rem}
    @media(max-width:640px){
      .btn-primary{width:100%;justify-content:center}
      .upload-zone{padding:2rem 1rem}
      .container{padding:0 1rem}
      .trust-bar{font-size:.8rem;padding:.625rem 1rem;gap:.6rem}
      .trust-bar span{white-space:nowrap}
      .tool-card{padding:1.125rem}
      footer{padding:2.5rem 0 1.5rem;margin-top:3rem}
    }
    @media(max-width:480px){
      .trust-bar{flex-direction:column;align-items:flex-start;gap:.375rem}
      input[type=number],input[type=text],input[type=email],textarea,select{font-size:.9rem;padding:.5rem .75rem}
    }
    .cookie-banner{position:fixed;bottom:0;left:0;right:0;background:#1A1530;color:white;padding:1rem 1.5rem;z-index:9998;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;transform:translateY(0);transition:transform .3s}
    .terms-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9997;display:flex;align-items:center;justify-content:center;padding:1rem}
    .terms-modal{background:white;border-radius:16px;padding:2rem;max-width:520px;width:100%}
    input[type=range]{accent-color:var(--primary)}
    input[type=number],input[type=text],input[type=email],textarea,select{border:1px solid var(--border);border-radius:8px;padding:.625rem 1rem;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;width:100%;outline:none;transition:border-color .2s}
    input[type=number]:focus,input[type=text]:focus,input[type=email]:focus,textarea:focus,select:focus{border-color:var(--primary)}
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-ring"></div>
    <p style="color:#7B3FF2;font-weight:700;font-size:1.2rem;">ILovePDF</p>
  </div>
  <div id="app" style="display:none;min-height:100vh;display:flex;flex-direction:column;"></div>
  <div id="cookie-banner" class="cookie-banner" style="display:none;">
    <p style="font-size:.9rem;">We use cookies for analytics and preferences. <a href="#cookies" style="color:#9B6BF5;text-decoration:underline;">Learn more</a></p>
    <div style="display:flex;gap:.75rem;flex-shrink:0;">
      <button onclick="window.acceptCookies('all')" style="background:#7B3FF2;color:white;border:none;border-radius:8px;padding:.5rem 1.25rem;cursor:pointer;font-weight:600;min-height:44px;font-family:'Plus Jakarta Sans',sans-serif">Accept</button>
      <button onclick="window.acceptCookies('essential')" style="background:transparent;color:#D1D5DB;border:1px solid #374151;border-radius:8px;padding:.5rem 1.25rem;cursor:pointer;min-height:44px;font-family:'Plus Jakarta Sans',sans-serif">Only Essential</button>
    </div>
  </div>
  <div id="terms-overlay" class="terms-overlay" style="display:none;">
    <div class="terms-modal">
      <h2 style="font-size:1.5rem;font-weight:700;color:#1A1530;margin-bottom:1rem;">Welcome to ILovePDF</h2>
      <p style="color:#6B7280;margin-bottom:1rem;line-height:1.6;">By using this service you agree to our <a href="#terms" style="color:#7B3FF2;">Terms of Service</a>. All file processing happens entirely in your browser — your files never leave your device.</p>
      <div style="background:#F3EEFF;border-radius:10px;padding:1rem;margin-bottom:1.5rem;">
        <p style="font-size:.875rem;color:#5B21B6;font-weight:600;">🔒 100% Private: Your files stay on your device</p>
      </div>
      <button onclick="window.acceptTerms()" class="btn-primary" style="width:100%;justify-content:center;">I Accept — Continue</button>
    </div>
  </div>
  <script type="module" src="/src/core/App.js"></script>
</body>
</html>
